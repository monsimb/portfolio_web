<section class="page blog-post">
  <article class="post-card">
    <header class="post-header">
      <p class="eyebrow">Blog post</p>

      <h1>{{ title() }}</h1>

      <div class="post-meta">
        <time>{{ date() | date:'longDate' }}</time>
      </div>

      <div class="post-tags" *ngIf="tags().length">
        <span *ngFor="let tag of tags()">#{{ tag }}</span>
      </div>
    </header>

    <div class="post-divider"></div>

    <div class="markdown-body" [innerHTML]="html()"></div>
  </article>
</section>
